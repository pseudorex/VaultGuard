<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — VaultGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=2.0">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" style="background: transparent; border-bottom: none; padding: 1.25rem 3rem;">
    <a href="index.html" class="brand">
      <div class="brand-icon">
        <svg style="width: 18px; height: 18px; fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
      </div>
      <span>VaultGuard</span>
    </a>
    <div class="nav-right">
      <span style="font-size: 0.85rem; color: #4b5563; font-weight: 500;">Already registered?</span>
      <a href="login.html" class="btn btn-primary btn-sm" style="padding: 0.5rem 1.15rem; font-size: 0.85rem;">Sign In</a>
    </div>
  </nav>

  <main class="auth-page-wrapper">
    <div class="auth-center-card" style="max-width: 480px;">
      <div class="auth-header-badge">
        <svg style="width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </div>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-desc">Register as a Backup Owner or Recovery Custodian.</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="display_name">Full Name / Display Name</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input type="text" id="display_name" class="form-control has-icon" placeholder="e.g. John Doe" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input type="email" id="email" class="form-control has-icon" placeholder="john@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 chars)</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" id="password" class="form-control has-icon" placeholder="••••••••" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Account Role</label>
          <select id="role" class="form-control" required style="cursor: pointer;">
            <option value="OWNER">Data Owner (Uploads & Requests Restores)</option>
            <option value="CUSTODIAN">Security Custodian (Reviews & Approves Restores)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.95rem; margin-top: 0.5rem;">
          <span>Create Account</span>
          <svg style="width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2;" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
