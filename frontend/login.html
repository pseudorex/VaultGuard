<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticate — VaultGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=2.0">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" style="background: transparent; border-bottom: none; padding: 1.25rem 3rem;">
    <a href="index.html" class="brand">
      <div class="brand-icon">
        <svg style="width: 18px; height: 18px; fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
      </div>
      <span>VaultGuard</span>
    </a>
    <div class="nav-right">
      <span style="font-size: 0.85rem; color: #4b5563; font-weight: 500;">No account?</span>
      <a href="register.html" class="btn btn-primary btn-sm" style="padding: 0.5rem 1.15rem; font-size: 0.85rem;">Register</a>
    </div>
  </nav>

  <main class="auth-page-wrapper">
    <!-- Center Authentication Card -->
    <div class="auth-center-card">
      <div class="auth-header-badge">
        <svg style="width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <rect x="9" y="11" width="6" height="5" rx="1" fill="currentColor"></rect>
          <path d="M10 11V9a2 2 0 1 1 4 0v2"></path>
        </svg>
      </div>

      <h1 class="auth-title">Authenticate</h1>
      <p class="auth-desc">Sign in to access encrypted backups or governance queues.</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input type="email" id="email" class="form-control has-icon" placeholder="user@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" id="password" class="form-control has-icon" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" id="toggle-password-btn" style="position: absolute; right: 0.85rem; background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center;">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.95rem; margin-top: 0.5rem; margin-bottom: 1.5rem;">
          <span>Sign In</span>
          <svg style="width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2;" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Pre-Configured Demo Accounts -->
      <div>
        <div style="font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem;">
          DEMO ACCOUNTS (PRE-CONFIGURED)
        </div>
        <div id="demo-account-list">
          <!-- Populated by auth.js -->
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Password visibility toggle
    document.getElementById("toggle-password-btn")?.addEventListener("click", () => {
      const pwdInput = document.getElementById("password");
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
      } else {
        pwdInput.type = "password";
      }
    });
  </script>
</body>
</html>
